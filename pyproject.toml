[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-review-lakehouse"
version = "0.1.0"
description = "Batch lakehouse pipeline for product-review data"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bronze*", "silver*", "gold*", "serving*", "schema_evolution*", "sentiment*"]
