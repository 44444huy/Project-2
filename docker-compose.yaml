name: product-review-lakehouse

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: product-review-airflow:2.10.5-spark3.5.9
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/project/src:ro
    - ./config:/opt/project/config:ro
    - ./schemas:/opt/project/schemas:ro
    - ./scripts:/opt/project/scripts:ro
    - ./spark/conf/spark-defaults.conf.template:/opt/project/spark-defaults.conf.template:ro
    - ./airflow/logs:/opt/airflow/logs
    - spark_ivy_cache:/tmp/.ivy2
    - hf_cache:/opt/hf-cache
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${AIRFLOW_DB:-airflow}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in .env}"
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME:?Set AIRFLOW_ADMIN_USERNAME in .env}"
    AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}"
    AIRFLOW_ADMIN_EMAIL: "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    AIRFLOW_TASK_RETRIES: "${AIRFLOW_TASK_RETRIES:-1}"
    AIRFLOW_RETRY_DELAY_SECONDS: "${AIRFLOW_RETRY_DELAY_SECONDS:-60}"
    DATA_MODE: "${DATA_MODE:-million}"
    SCHEMA_CHECK_MODE: "${SCHEMA_CHECK_MODE:-report}"
    SCHEMA_CHECK_LINES_PER_PART: "${SCHEMA_CHECK_LINES_PER_PART:-20000}"
    QUALITY_GUARD_MODE: "${QUALITY_GUARD_MODE:-report}"
    SENTIMENT_DEVICE: "${SENTIMENT_DEVICE:-cuda}"
    SENTIMENT_BATCH_SIZE: "${SENTIMENT_BATCH_SIZE:-64}"
    QUALITY_GUARD_MAX_REJECT_RATE_INCREASE: "${QUALITY_GUARD_MAX_REJECT_RATE_INCREASE:-0.01}"
    QUALITY_GUARD_MAX_ISSUE_RATE_INCREASE: "${QUALITY_GUARD_MAX_ISSUE_RATE_INCREASE:-0.05}"
    QUALITY_GUARD_MAX_ACCEPTED_DROP: "${QUALITY_GUARD_MAX_ACCEPTED_DROP:-0.05}"
    CODE_VERSION: "${CODE_VERSION:-local-working-tree}"
    SPARK_MASTER: "${SPARK_MASTER:-local[2]}"
    SPARK_DRIVER_MEMORY: "${SPARK_DRIVER_MEMORY:-2g}"
    SPARK_SHUFFLE_PARTITIONS: "${SPARK_SHUFFLE_PARTITIONS:-8}"
    SPARK_DEFAULT_PARALLELISM: "${SPARK_DEFAULT_PARALLELISM:-8}"
    SPARK_LOCAL_DIR: /tmp/spark-local
    SPARK_CONF_DIR: /tmp/spark-conf
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
    POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    POLARIS_CLIENT_ID: "${POLARIS_CLIENT_ID:?Set POLARIS_CLIENT_ID in .env}"
    POLARIS_CLIENT_SECRET: "${POLARIS_CLIENT_SECRET:?Set POLARIS_CLIENT_SECRET in .env}"
    MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
    MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
services:
  # PostgreSQL stores Polaris catalog metadata and query-ready serving tables.
  postgres:
    image: postgres:16-alpine
    container_name: product_review_postgres
    restart: always
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POLARIS_DB_USER: "${POLARIS_DB_USER:?Set POLARIS_DB_USER in .env}"
      POLARIS_DB_PASSWORD: "${POLARIS_DB_PASSWORD:?Set POLARIS_DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U review_user -d review_lakehouse
      interval: 5s
      timeout: 5s
      retries: 10

  # Create Airflow metadata storage and serving operations tables idempotently.
  postgres-serving-setup:
    image: postgres:16-alpine
    container_name: product_review_postgres_serving_setup
    restart: "no"
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      AIRFLOW_DB: "${AIRFLOW_DB:-airflow}"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        if ! psql -h postgres -U "$${POSTGRES_USER}" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = '$${AIRFLOW_DB}'" | grep -q 1; then
          createdb -h postgres -U "$${POSTGRES_USER}" \
            -O "$${POSTGRES_USER}" "$${AIRFLOW_DB}"
        fi

        psql -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
          -v ON_ERROR_STOP=1 <<'SQL'
        CREATE SCHEMA IF NOT EXISTS serving AUTHORIZATION review_user;

        CREATE TABLE IF NOT EXISTS serving.pipeline_runs (
            run_id TEXT PRIMARY KEY,
            dag_id TEXT NOT NULL,
            status TEXT NOT NULL CONSTRAINT pipeline_runs_status_check CHECK (
                status IN (
                    'RUNNING', 'PUBLISHED', 'SUCCESS', 'FAILED',
                    'SCHEMA_DRIFT_BLOCKED', 'QUALITY_GUARD_BLOCKED'
                )
            ),
            data_mode TEXT NOT NULL,
            review_limit BIGINT,
            code_version TEXT NOT NULL,
            source_config JSONB,
            run_config JSONB,
            table_counts JSONB,
            iceberg_snapshots JSONB,
            airflow_log_url TEXT,
            started_at TIMESTAMPTZ NOT NULL,
            published_at TIMESTAMPTZ,
            finished_at TIMESTAMPTZ,
            duration_seconds DOUBLE PRECISION,
            error_message TEXT,
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
        );

        DO $$pipeline_runs_migration$$
        BEGIN
          IF EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'serving'
                AND table_name = 'pipeline_runs'
                AND column_name = 'sample_size'
          ) AND NOT EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'serving'
                AND table_name = 'pipeline_runs'
                AND column_name = 'review_limit'
          ) THEN
            ALTER TABLE serving.pipeline_runs
              RENAME COLUMN sample_size TO review_limit;
          ELSIF EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_schema = 'serving'
                AND table_name = 'pipeline_runs'
                AND column_name = 'sample_size'
          ) THEN
            UPDATE serving.pipeline_runs
              SET review_limit = COALESCE(review_limit, sample_size);
            ALTER TABLE serving.pipeline_runs DROP COLUMN sample_size;
          END IF;
        END
        $$pipeline_runs_migration$$;

        ALTER TABLE serving.pipeline_runs
          ALTER COLUMN review_limit DROP NOT NULL;
        UPDATE serving.pipeline_runs
          SET review_limit = 1000000
          WHERE data_mode = 'million';
        UPDATE serving.pipeline_runs
          SET review_limit = NULL
          WHERE data_mode = 'full';

        CREATE INDEX IF NOT EXISTS pipeline_runs_started_at_idx
          ON serving.pipeline_runs (started_at DESC);

        ALTER TABLE serving.pipeline_runs
          DROP CONSTRAINT IF EXISTS pipeline_runs_status_check;
        ALTER TABLE serving.pipeline_runs
          ADD CONSTRAINT pipeline_runs_status_check CHECK (
            status IN (
              'RUNNING', 'PUBLISHED', 'SUCCESS', 'FAILED',
              'SCHEMA_DRIFT_BLOCKED', 'QUALITY_GUARD_BLOCKED'
            )
          );

        CREATE TABLE IF NOT EXISTS serving.schema_drift_events (
            run_id TEXT NOT NULL,
            source_name TEXT NOT NULL,
            mode TEXT NOT NULL,
            action TEXT NOT NULL CHECK (
                action IN ('ACCEPT', 'REVIEW', 'BLOCK', 'ERROR')
            ),
            baseline_version INTEGER,
            records BIGINT,
            malformed BIGINT,
            sampled_partitions INTEGER,
            lines_per_partition INTEGER,
            raw_path TEXT,
            changes JSONB NOT NULL DEFAULT '[]'::jsonb,
            error_message TEXT,
            checked_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            PRIMARY KEY (run_id, source_name)
        );

        CREATE TABLE IF NOT EXISTS serving.quality_guard_checks (
            run_id TEXT NOT NULL,
            check_name TEXT NOT NULL,
            source_name TEXT NOT NULL,
            metric_name TEXT NOT NULL,
            mode TEXT NOT NULL,
            action TEXT NOT NULL CHECK (
                action IN ('PASS', 'BLOCK', 'OVERRIDDEN')
            ),
            previous_value DOUBLE PRECISION,
            current_value DOUBLE PRECISION,
            limit_value DOUBLE PRECISION,
            message TEXT,
            checked_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            PRIMARY KEY (run_id, check_name, source_name, metric_name)
        );
        SQL
    depends_on:
      postgres:
        condition: service_healthy
  # Bootstrap the Polaris realm once against its persistent PostgreSQL store.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    container_name: product_review_polaris_bootstrap
    restart: "no"
    environment:
      POLARIS_PERSISTENCE_TYPE: "relational-jdbc"
      QUARKUS_DATASOURCE_DB_KIND: "postgresql"
      QUARKUS_DATASOURCE_USERNAME: "${POLARIS_DB_USER:?Set POLARIS_DB_USER in .env}"
      QUARKUS_DATASOURCE_PASSWORD: "${POLARIS_DB_PASSWORD:?Set POLARIS_DB_PASSWORD in .env}"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/polaris"
      POLARIS_REALM: "${POLARIS_REALM:?Set POLARIS_REALM in .env}"
      POLARIS_CLIENT_ID: "${POLARIS_CLIENT_ID:?Set POLARIS_CLIENT_ID in .env}"
      POLARIS_CLIENT_SECRET: "${POLARIS_CLIENT_SECRET:?Set POLARIS_CLIENT_SECRET in .env}"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set +e
        /opt/jboss/container/java/run/run-java.sh \
          bootstrap \
          -r "$${POLARIS_REALM}" \
          -c "$${POLARIS_REALM},$${POLARIS_CLIENT_ID},$${POLARIS_CLIENT_SECRET}"
        bootstrap_status=$$?

        if [ "$$bootstrap_status" -eq 0 ] || [ "$$bootstrap_status" -eq 3 ]; then
          exit 0
        fi

        exit "$$bootstrap_status"
    depends_on:
      postgres:
        condition: service_healthy

  # Polaris is the REST catalog; table files remain in MinIO.
  polaris:
    image: apache/polaris:1.7.0
    container_name: product_review_polaris
    restart: always
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    environment:
      POLARIS_PERSISTENCE_TYPE: "relational-jdbc"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: "postgresql"
      QUARKUS_DATASOURCE_USERNAME: "${POLARIS_DB_USER:?Set POLARIS_DB_USER in .env}"
      QUARKUS_DATASOURCE_PASSWORD: "${POLARIS_DB_PASSWORD:?Set POLARIS_DB_PASSWORD in .env}"
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/polaris"
      POLARIS_REALM_CONTEXT_REALMS: "${POLARIS_REALM:?Set POLARIS_REALM in .env}"
      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3"]'
      polaris.features."DROP_WITH_PURGE_ENABLED": "true"
      polaris.readiness.ignore-severe-issues: "true"
      AWS_REGION: "ap-southeast-1"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8182/q/health
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully

  # One MinIO instance stores both Raw objects and Iceberg table files.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: product_review_minio
    restart: always
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
      MINIO_SITE_REGION: "ap-southeast-1"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # The shared lakehouse bucket contains raw/ and warehouse/ prefixes.
  minio-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: product_review_minio_setup
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/lakehouse && mc ls local/lakehouse

  # Land one immutable full Raw snapshot used by every processing profile.
  raw-setup:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: product_review_raw_setup
    restart: "no"
    volumes:
      - ./data/full:/opt/project/full:ro
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        base="local/lakehouse/raw/amazon_reviews_2023_electronics"
        target="$${base}/full"
        if mc stat "$${target}/_COMPLETE" >/dev/null 2>&1; then
          echo "Full Raw snapshot already landed"
        else
          test -f /opt/project/full/_COMPLETE
          test -f /opt/project/full/reviews/part-00000.jsonl.gz
          test -f /opt/project/full/products/part-00000.jsonl.gz
          mc cp /opt/project/full/reviews/part-*.jsonl.gz "$${target}/reviews/"
          mc cp /opt/project/full/products/part-*.jsonl.gz "$${target}/products/"
          mc cp /opt/project/full/full_manifest.json "$${target}/manifest.json"
          mc cp /opt/project/full/_COMPLETE "$${target}/_COMPLETE"
        fi
        mc ls --recursive "$${target}"
  # Create the product-review Polaris catalog idempotently.
  polaris-catalog-setup:
    image: python:3.12-alpine
    container_name: product_review_polaris_catalog_setup
    restart: "no"
    environment:
      POLARIS_BASE_URL: "${POLARIS_BASE_URL:?Set POLARIS_BASE_URL in .env}"
      POLARIS_REALM: "${POLARIS_REALM:?Set POLARIS_REALM in .env}"
      POLARIS_CLIENT_ID: "${POLARIS_CLIENT_ID:?Set POLARIS_CLIENT_ID in .env}"
      POLARIS_CLIENT_SECRET: "${POLARIS_CLIENT_SECRET:?Set POLARIS_CLIENT_SECRET in .env}"
      POLARIS_CATALOG_NAME: "${POLARIS_CATALOG_NAME:?Set POLARIS_CATALOG_NAME in .env}"
      POLARIS_CATALOG_ROLE: "${POLARIS_CATALOG_ROLE:?Set POLARIS_CATALOG_ROLE in .env}"
      POLARIS_WAREHOUSE: "${POLARIS_WAREHOUSE:?Set POLARIS_WAREHOUSE in .env}"
      POLARIS_S3_ENDPOINT: "${POLARIS_S3_ENDPOINT:?Set POLARIS_S3_ENDPOINT in .env}"
      POLARIS_S3_REGION: "${POLARIS_S3_REGION:?Set POLARIS_S3_REGION in .env}"
    volumes:
      - ./scripts/setup_polaris_catalog.py:/opt/setup/setup_polaris_catalog.py:ro
    command:
      - python
      - /opt/setup/setup_polaris_catalog.py
    depends_on:
      polaris:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  spark-ivy-init:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: product_review_spark_ivy_init
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 185:185 /tmp/.ivy2 && chmod -R 0777 /tmp/.ivy2
    volumes:
      - spark_ivy_cache:/tmp/.ivy2

  airflow-init:
    <<: *airflow-common
    container_name: product_review_airflow_init
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -eu
        airflow db migrate
        if airflow users list --output json | python -c 'import json, os, sys; users = json.load(sys.stdin); sys.exit(not any(user["username"] == os.environ["AIRFLOW_ADMIN_USERNAME"] for user in users))'; then
          airflow users reset-password \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}"
        else
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Product \
            --lastname Review \
            --role Admin \
            --email "$${AIRFLOW_ADMIN_EMAIL}"
        fi
    depends_on:
      postgres-serving-setup:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: product_review_airflow_webserver
    restart: unless-stopped
    command:
      - webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health')
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: product_review_airflow_scheduler
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
    command:
      - /opt/project/scripts/render_spark_config.sh && exec airflow scheduler
    ports:
      - "127.0.0.1:4041:4040"
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-ivy-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      polaris:
        condition: service_healthy
      polaris-catalog-setup:
        condition: service_completed_successfully
      raw-setup:
        condition: service_completed_successfully
  # Thin application layer: direct parameterized queries to PostgreSQL Serving.
  dashboard:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: product-review-dashboard:1.0
    container_name: product_review_dashboard
    restart: unless-stopped
    environment:
      DATA_MODE: "${DATA_MODE:-million}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres-serving-setup:
        condition: service_completed_successfully

  tests:
    profiles: [ "tools" ]
    image: product-review-spark:3.5.9
    build:
      context: .
      dockerfile: spark/Dockerfile
    working_dir: /opt/project
    volumes:
      - ./src:/opt/project/src:ro
      - ./config:/opt/project/config:ro
      - ./tests:/opt/project/tests:ro
      - ./schemas:/opt/project/schemas:ro
      - ./scripts:/opt/project/scripts:ro
      - ./airflow:/opt/project/airflow:ro
      - ./docker-compose.yaml:/opt/project/docker-compose.yaml:ro
      - spark_ivy_cache:/tmp/.ivy2
    environment:
      DATA_MODE: "${DATA_MODE:-million}"
      SPARK_MASTER: "local[2]"
      SPARK_DRIVER_MEMORY: "2g"
      SPARK_SHUFFLE_PARTITIONS: "8"
      SPARK_DEFAULT_PARALLELISM: "8"
      SPARK_LOCAL_DIR: /tmp/spark-local
      POSTGRES_HOST: postgres

      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POLARIS_CLIENT_ID: "${POLARIS_CLIENT_ID:?Set POLARIS_CLIENT_ID in .env}"
      POLARIS_CLIENT_SECRET: "${POLARIS_CLIENT_SECRET:?Set POLARIS_CLIENT_SECRET in .env}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}"
    command:
      - /opt/spark/bin/spark-submit
      - /opt/project/tests/run_suite.py

volumes:
  postgres_data:
  minio_data:
  spark_ivy_cache:
  hf_cache:
